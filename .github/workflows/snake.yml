name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: # allows manual run from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Ahmed-Adel-0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2E9EF7&color_dots=#0d1117,#0a3a5c,#0f5b8f,#1b7fc4,#2E9EF7
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2E9EF7&color_dots=#161b22,#0d3a5c,#125a8c,#1a7dc0,#2E9EF7

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
